
# =========================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# =========================================================

# Nombre de la aplicación Spring Boot.
spring.application.name=ecovida-springboot


# =========================================================
# CONFIGURACIÓN DE BASE DE DATOS
# =========================================================

# Usa Aiven en Render y MySQL local si DB_URL no está definida.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecovidasas_spring}

# Usuario de MySQL.
spring.datasource.username=${DB_USERNAME}

# Contraseña de MySQL.
# Se obtiene mediante una variable de entorno.
spring.datasource.password=${DB_PASSWORD}


# =========================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =========================================================

# Actualiza automáticamente las tablas según las entidades.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola.
spring.jpa.show-sql=true


# =========================================================
# CONFIGURACIÓN DEL SERVIDOR
# =========================================================

# Usa el puerto de Render o el 8080 en local.
server.port=${PORT:8080}


# =========================================================
# CONFIGURACIÓN JWT
# =========================================================

# Clave secreta utilizada para firmar los tokens JWT.
# El valor real se obtiene mediante una variable de entorno.
jwt.secret=${JWT_SECRET}
